# ansible/helm.yml
---
- name: Install Helm
  hosts: local
  become: yes
  tasks:
    - name: Ensure dependencies are installed
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - apt-transport-https
        - ca-certificates
        - curl
        - software-properties-common

    - name: Download Helm GPG key
      get_url:
        url: https://baltocdn.com/helm/signing.asc
        dest: /usr/share/keyrings/helm-archive-keyring.gpg
        mode: '0644'

    - name: Add Helm repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/helm-archive-keyring.gpg] https://baltocdn.com/helm/stable/debian/ all main"
        state: present

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Helm
      apt:
        name: helm
        state: present

    - name: Verify Helm installation
      command: helm version
      register: helm_version

    - name: Display Helm version
      debug:
        msg: "{{ helm_version.stdout }}"